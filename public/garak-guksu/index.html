<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>역전국수</title>
  <style>
    :root { --bg:#0c0f1a; --amber:#ffcf6a; }
    html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:#fff;
      font-family:system-ui,sans-serif;-webkit-user-select:none;user-select:none;}
    #game{display:block;width:100vw;height:100vh;touch-action:none;}
    #home{position:fixed;top:10px;left:12px;z-index:6;background:rgba(0,0,0,.5);color:#fff;
      text-decoration:none;font-size:13px;font-weight:700;padding:10px 12px;border-radius:12px;}
    #mute{position:fixed;top:10px;right:12px;z-index:6;background:rgba(0,0,0,.5);color:#fff;border:0;
      font-size:18px;font-weight:700;padding:8px 12px;border-radius:12px;cursor:pointer;line-height:1;}
    #hud{position:fixed;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:14px;
      background:rgba(0,0,0,.5);padding:8px 16px;border-radius:14px;font-weight:800;font-size:15px;z-index:5;
      flex-wrap:wrap;justify-content:center;max-width:96vw;}
    .overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:18px;background:rgba(8,10,20,.92);z-index:10;text-align:center;padding:24px;}
    .overlay.off{display:none;}
    .overlay h1{font-size:40px;margin:0;}
    .overlay button{font-size:20px;font-weight:900;padding:14px 32px;border:0;border-radius:16px;cursor:pointer;
      background:linear-gradient(135deg,var(--amber),#ff8a5c);color:#1a0f10;}
    #pop{position:fixed;left:50%;top:34%;transform:translateX(-50%);pointer-events:none;opacity:0;
      font-size:34px;font-weight:900;color:#ffd34d;text-shadow:0 2px 0 #7a3a00,0 0 14px rgba(255,200,60,.7);white-space:nowrap;z-index:8;}
    #pop.show{animation:popUp .9s ease-out;}
    @keyframes popUp{0%{opacity:0;transform:translateX(-50%) translateY(10px) scale(.6);}
      20%{opacity:1;transform:translateX(-50%) translateY(0) scale(1.1);}
      100%{opacity:0;transform:translateX(-50%) translateY(-40px) scale(1);}}
    #flash{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .12s;z-index:7;
      background:radial-gradient(circle,rgba(255,200,60,0) 45%,rgba(255,170,40,.4) 100%);}
    @media (prefers-reduced-motion: reduce){#pop.show{animation-duration:.3s;}}
    #touch{display:none;}
    @media (pointer:coarse){#touch{display:block;}}
    #joy{position:fixed;left:calc(18px + env(safe-area-inset-left));bottom:calc(20px + env(safe-area-inset-bottom));
      width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 50% 40%,rgba(120,90,60,.5),rgba(20,16,28,.75));
      border:3px solid var(--amber);touch-action:none;z-index:6;}
    #knob{position:absolute;left:50%;top:50%;width:54px;height:54px;border-radius:50%;transform:translate(-50%,-50%);
      background:radial-gradient(circle at 42% 36%,#ffe9c0,#ffae5c 60%,#c8801a);border:2px solid #ffe3c0;}
    #act{position:fixed;right:calc(20px + env(safe-area-inset-right));bottom:calc(40px + env(safe-area-inset-bottom));
      width:104px;height:104px;border-radius:50%;border:4px solid #ffe14a;font-size:22px;font-weight:900;color:#2a160a;z-index:6;
      background:radial-gradient(circle at 42% 34%,#fff3b0,#ffd23d 55%,#f2a400);touch-action:manipulation;}
    #spicebtns{position:fixed;right:calc(16px + env(safe-area-inset-right));bottom:calc(150px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px;z-index:6;}
    #spicebtns button{padding:7px 10px;border-radius:10px;border:2px solid #c23b3b;background:rgba(20,16,28,.8);color:#ffd;font-weight:700;font-size:12px;touch-action:manipulation;}
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="pop" aria-live="polite"></div>
  <div id="flash"></div>
  <a id="home" href="/">← 홈</a>
  <button id="mute" aria-label="음소거" aria-pressed="false">🔊</button>
  <div id="hud" role="status" aria-live="off">
    <span class="lives" id="lives" aria-label="라이프">❤❤❤❤❤</span>
    <span>점수 <span id="score">0</span></span>
    <span id="combo">콤보 0</span>
    <span id="wave">증기 · 1/5</span>
    <span>🚂 <span id="dwell">1:15</span></span>
    <span>주문 <span id="order">-</span></span>
    <span>들고 <span id="held">빈손</span></span>
  </div>
  <div class="overlay" id="start">
    <h1>🏮 역전국수</h1>
    <p>WASD로 주방을 움직이고 <b>E</b>로 조리대·손님과 상호작용.<br>국수를 집어 손님에게 가져다주세요.</p>
    <button id="startbtn">▶ 영업 시작</button>
  </div>
  <div class="overlay off" id="result">
    <h1 id="result-title">오늘의 장사 마감</h1>
    <p id="result-sub"></p>
    <div id="result-stats" style="line-height:1.8;font-size:15px"></div>
    <button id="replaybtn">▶ 다시 한 그릇</button>
  </div>
  <div id="touch" aria-hidden="true">
    <div id="joy"><div id="knob"></div></div>
    <button id="act">담기</button>
    <div id="spicebtns"><button data-s="none">안맵게</button><button data-s="normal">기본</button><button data-s="extra">많이</button></div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
