<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fryffel Tower — 감자튀김 마천루</title>
  <link rel="stylesheet" href="./style.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/",
      "cannon-es": "https://esm.sh/cannon-es@0.20.0"
    }
  }
  </script>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="webgl-error" class="overlay hidden">
    <div class="panel"><h1>WebGL을 사용할 수 없습니다</h1><p>최신 브라우저에서 실행해 주세요.</p></div>
  </div>

  <div id="menu" class="overlay">
    <div class="panel">
      <h1 class="title">FRYFFEL TOWER</h1>
      <p class="subtitle">감자튀김을 쌓아 가장 높은 탑을!</p>
      <button id="start-btn" class="btn-primary">쌓기 시작</button>
      <div class="controls">
        <span>← →</span><span>좌우</span>
        <span>↑ ↓</span><span>앞뒤(깊이)</span>
        <span>Q / E</span><span>회전</span>
        <span>Space</span><span>놓기</span>
      </div>
    </div>
  </div>

  <div id="hud" class="hidden">
    <div id="hud-height">🗼 <span id="height-val">0.0</span> m</div>
    <div id="hud-time">⏱ <span id="time-val">90</span></div>
    <div id="hud-score">⭐ <span id="score-val">0</span></div>
    <div id="hud-combo">🔥 <span id="combo-val">0</span></div>
  </div>

  <!-- Mute button — always visible, works in solo + multiplayer -->
  <button id="mute-btn" aria-label="Toggle mute">🔊</button>

  <!-- Help button (controls reference) — visible during play (z-index below menu/result) -->
  <button id="help-btn" aria-label="도움말">❔</button>

  <div id="opponents" class="hidden"></div>

  <!-- Sabotage panel (multiplayer-only; revealed by Multiplayer.js, hidden in solo) -->
  <div id="sabotage-panel" class="hidden">
    <div id="sabotage-label">😈 방해</div>
    <div id="sabotage-meter"><i id="sabotage-fill"></i></div>
    <div id="sabotage-held" class="hidden"></div>
    <button id="fire-sabotage" class="hidden" aria-label="Fire sabotage">🎯 발사 (F)</button>
  </div>

  <!-- Ketchup splat overlay (ketchup sabotage effect) -->
  <div id="ketchup-splat" class="hidden"></div>

  <!-- Touch buttons — shown only on coarse-pointer (touch) devices via CSS -->
  <div id="touch-controls">
    <button id="rot-left" class="touch-btn" aria-label="Rotate left">⟲</button>
    <button id="view-btn" class="touch-btn" aria-label="Rotate camera">🔄</button>
    <button id="rot-right" class="touch-btn" aria-label="Rotate right">⟳</button>
  </div>
  <!-- One-time touch control hint (shown once on first mobile play) -->
  <div id="touch-hint" class="hidden">드래그 이동 · ⟲ ⟳ 회전 · 탭 놓기 · 🔄 시점</div>

  <!-- Controls help overlay (full control reference + assist toggle; pauses the round) -->
  <div id="help-overlay" class="overlay hidden">
    <div class="panel">
      <h1 class="title help-title">조작법</h1>
      <div class="controls help-controls">
        <span>← →</span><span>좌우</span>
        <span>↑ ↓</span><span>앞뒤(깊이)</span>
        <span>Q / E</span><span>회전(교차)</span>
        <span>Z / X</span><span>기울이기</span>
        <span>W / S</span><span>높이</span>
        <span>[ ]</span><span>카메라</span>
        <span>Space</span><span>놓기</span>
        <span>R</span><span>리셋</span>
      </div>
      <p class="subtitle help-mobile">📱 드래그=이동 · 탭=놓기 · ⟲ ⟳=회전 · 🔄=시점</p>
      <button id="assist-toggle">🎯 보정: 끔</button>
      <button id="help-close" class="btn-primary">닫기</button>
    </div>
  </div>

  <div id="result" class="overlay hidden">
    <div class="panel">
      <h1 class="title" id="result-title">시간 종료!</h1>
      <p class="subtitle" id="result-detail"></p>
      <button id="restart-btn" class="btn-primary">다시 쌓기</button>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
