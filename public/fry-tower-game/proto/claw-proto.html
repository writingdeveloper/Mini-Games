<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claw Proto — 뽑기 손맛</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #ffe39a; font-family: system-ui, sans-serif; }
    #game { display: block; width: 100vw; height: 100vh; touch-action: none; }
    #hint { position: fixed; left: 12px; bottom: 12px; background: rgba(40,24,8,.8); color: #ffe9c2;
      padding: 8px 12px; border-radius: 10px; font-size: 13px; line-height: 1.5; border: 2px solid #ffce7a; }
    #hint b { color: #fff; }
    #readout { position: fixed; right: 12px; top: 12px; background: rgba(40,24,8,.85); color: #ffe9c2;
      padding: 8px 12px; border-radius: 10px; font-size: 14px; line-height: 1.6; border: 2px solid #ffce7a; min-width: 150px; }
    #readout span { color: #ffd479; font-weight: 800; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/",
      "cannon-es": "https://esm.sh/cannon-es@0.20.0"
    }
  }
  </script>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hint">
    <b>← → ↑ ↓</b> 집게 위치 (위에서) · <b>[ ]</b> 카메라<br>
    <b>Space</b> 집게 내리기! — 위치 잡고 누르면 <b>자동으로</b> 하강·집기·올림·<b>배출구(초록)</b>로 이동해 떨굼.<br>
    집게 힘이 약해 <b>치우치거나 무거우면 가는 길에 미끄러집니다</b> — 잘 노려서!
  </div>
  <div id="readout">
    담은 가치: <span id="r-score">0</span><br>
    들고 있음: <span id="r-held">-</span><br>
    미끄러짐: <span id="r-slip">0</span><br>
    남은 시간: <span id="r-time">--</span>
  </div>
  <script type="module" src="./claw-proto.js"></script>
</body>
</html>
