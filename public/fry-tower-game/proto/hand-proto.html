<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fryffel Tower — 손 조작 프로토타입</title>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/",
      "cannon-es": "https://esm.sh/cannon-es@0.20.0"
    }
  }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #ffe39a; font-family: system-ui, sans-serif; }
    #game { display: block; width: 100vw; height: 100vh; }
    #hint {
      position: fixed; top: 14px; left: 14px; z-index: 10;
      background: rgba(30,18,4,.82); color: #fff; padding: 12px 14px; border-radius: 12px;
      font-size: 13px; line-height: 1.7; max-width: 280px; box-shadow: 0 4px 14px rgba(0,0,0,.2);
    }
    #hint b { color: #ffd34d; }
    #hint .kbd { display:inline-block; background:#fff; color:#1e1204; border-radius:5px; padding:1px 6px; font-weight:700; font-size:12px; margin:0 1px; }
    #hint hr { border:0; border-top:1px solid rgba(255,255,255,.2); margin:8px 0; }
    #readout { position: fixed; top: 14px; right: 14px; z-index: 10;
      background: rgba(30,18,4,.82); color:#fff; padding:10px 14px; border-radius:12px; font-size:13px; line-height:1.6; text-align:right; }
    #readout b { color:#ffd34d; }
    .tag { display:inline-block; background:#d23b2a; color:#fff; border-radius:6px; padding:1px 7px; font-size:11px; font-weight:700; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hint">
    <div><span class="tag">프로토타입</span> 셰프 손 — 입체 배치</div>
    <hr>
    <b>← →</b> 좌우(X) · <b>↑ ↓</b> 앞뒤(Z, 깊이)<br>
    <b>Q / E</b> 수평 회전(yaw·교차) <br>
    <b>Z / X</b> 기울이기(tilt) · <b>W / S</b> 높이<br>
    <b>[ ]</b> 카메라 돌리기<br>
    <span class="kbd">Space</span> 놓기 (빠르게 움직이다 놓으면 <b>휙</b>)<br>
    <hr>
    <span class="kbd">A</span> 초보 보정 · <span class="kbd">R</span> 리셋<br>
    <span style="opacity:.7">마우스: 드래그=좌우+깊이 · 탭=놓기</span>
  </div>

  <div id="readout">
    쌓은 개수 <b id="r-count">0</b><br>
    놓을 때 속도 <b id="r-speed">0.0</b><br>
    각도(yaw/tilt) <b id="r-rot">0° / 0°</b><br>
    보정 <b id="r-assist">OFF</b>
  </div>

  <script type="module" src="./hand-proto.js"></script>
</body>
</html>
