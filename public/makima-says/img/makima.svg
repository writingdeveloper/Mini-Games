<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="마키마">
  <title>마키마</title>
  <defs>
    <radialGradient id="mg" cx="50%" cy="42%" r="68%">
      <stop offset="0%" stop-color="#3a2a12"/>
      <stop offset="62%" stop-color="#1c140a"/>
      <stop offset="100%" stop-color="#0b0806"/>
    </radialGradient>
  </defs>
  <rect width="100" height="100" fill="url(#mg)"/>
  <!-- concentric "control" rings (마키마 = 지배/복종) -->
  <circle cx="50" cy="50" r="35" fill="none" stroke="#d9b44a" stroke-width="2" opacity="0.85"/>
  <circle cx="50" cy="50" r="26" fill="none" stroke="#d9b44a" stroke-width="1.4" opacity="0.55"/>
  <circle cx="50" cy="50" r="17" fill="none" stroke="#f0d68a" stroke-width="1.4" opacity="0.9"/>
  <!-- command chevron (obey = press the direction) -->
  <path d="M50 35 L63 57 L50 50 L37 57 Z" fill="#f0d68a"/>
  <circle cx="50" cy="50" r="2.6" fill="#fff6dc"/>
</svg>
